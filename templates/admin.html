<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <form method="post"><button name='logout' type="submit">Wyloguj się</button></form>

    <h1>Dodaj nowego pracownika</h1>
    <font color="maroon">{{ data['message_add'] }}</font><br>
    <font color="maroon">{{ data['message_add_id'] }}</font><br>
    <form method="post">
        <input type="text" placeholder="Imię i Nazwisko pracownika" name="name_employee">
        <button type="submit" name="add_employee">Dodaj pracownika</button>
    </form>

    <br>

    <h1>Zakoduj tag NFC</h1>
    <p id="status"></p>
    <select id="emp_id">
        {% for employee in data['list_employees']['list_employees'] %}
            <option value="{{ employee }}">{{ employee }}</option>
        {% endfor %}
    </select>
    <button id="button_tag">Zapisz ID na karcie NFC </button>

    <script>
    document.getElementById("button_tag").addEventListener("click", async () => {
        const status = document.getElementById("status");
        const selectElem = document.getElementById("emp_id");

        // Pobieramy wyłącznie wartość zaznaczonej opcji
        const selectedKey = selectElem.value;

        if (!selectedKey) {
            status.innerText = "Nie wybrano żadnego klucza!";
            status.style.color = "maroon";
            return;
        }

        if (!("NDEFReader" in window)) {
            status.innerText = "Brak obsługi Web NFC w tej przeglądarce.";
            status.style.color = "maroon";
            return;
        }

        try {
            status.innerText = "Przyłóż kartę do telefonu...";
            status.style.color = "orange";

            const ndef = new NDEFReader();
            // Zapis tylko wybranego klucza
            await ndef.write({
                records: [{ recordType: "text", data: selectedKey }]
            }, { overwrite: true });

            status.innerText = "Sukces! Zapisano klucz: " + selectedKey;
            status.style.color = "green";
        } catch (error) {
            status.innerText = "Błąd zapisu: " + error.message;
            status.style.color = "maroon";
        }
    });
    </script>

    <h1>Usuń pracownika</h1>
    <font color="maroon">{{ data['message_del'] }}</font>
    <form method="post">
        <select name="employee">
            {% for employee in data['list_employees']['list_employees'] %}
                <option value="{{ employee }}">{{ employee }}</option>
            {% endfor %}
        </select>
        <button type="submit" name="del_employee">Usuń pracownika</button>
    </form>
</body>
</html>
