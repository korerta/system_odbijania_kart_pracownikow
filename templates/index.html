<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <a href="{{ url_for('login') }}">Panel Administratora</a>

    <button id="scanBtn">Rozpocznij skanowanie NFC</button>
    <select id="operation">
        <option value="choose">Wybierz opcję</option>
        <option value="in">Rozpoczęcie pracy</option>
        <option value="out_temp">Wyjście z pracy</option>
        <option value="in_back">Powrót do pracy</option>
        <option value="out">Zakończenie pracy</option>
    </select>
    <p id="status">Status: Oczekiwanie na uruchomienie...</p>
    <div id="output"></div>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const statusEl = document.getElementById('status');
        const operation = document.getElementById('operation');
        let nfcController = null;

        scanBtn.addEventListener('click', async () => {
            // 1. Sprawdzenie, czy przeglądarka wspiera Web NFC
            if (!('NDEFReader' in window)) {
                statusEl.innerText = "Błąd: Twoja przeglądarka nie obsługuje Web NFC (użyj Chrome na Androidzie).";
                return;
            }

            try {
                // 2. Inicjalizacja kontrolera do zatrzymania skanowania po 1 odczycie
                nfcController = new AbortController();

                const ndef = new NDEFReader();
                await ndef.scan({ signal: nfcController.signal });

                statusEl.innerText = "Status: Skaner aktywny. Przyłóż tag NFC do pleców telefonu...";
                scanBtn.disabled = true;

                // 3. Obsługa zdarzenia wykrycia i odczytania taga
                ndef.addEventListener("reading", async ({ message, serialNumber }) => {
                    // ZATRZYMANIE SKANERA: wyłączamy nasłuchiwanie NFC po wykryciu karty
                    if (nfcController) {
                        nfcController.abort();
                        nfcController = null;
                    }

                    statusEl.innerText = "Status: Odczytano tag! Wysyłanie do serwera...";

                    // Dekodowanie zawartości tekstowej z rekordów NDEF
                    const textDecoder = new TextDecoder();
                    const recordsData = [];

                    for (const record of message.records) {
                        if (record.recordType === "text") {
                            recordsData.push({
                                type: "text",
                                data: textDecoder.decode(record.data)
                            });
                        } else {
                            recordsData.push({
                                type: record.recordType,
                                data: "Typ inny niż czysty tekst"
                            });
                        }
                    }

                    // Przygotowanie paczki danych do wysłania
                    const payload = {
                        serialNumber: serialNumber,
                        records: recordsData,
                        type_operation: operation.value
                    };

                    // 4. Wysłanie danych do Flaska
                    try {
                        const response = await fetch('/api/nfc', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();
                        console.log("Odpowiedź z Flaska:", result);
                        statusEl.innerText = "Status: " + result.message;
                    } catch (err) {
                        console.error("Błąd podczas wysyłania do Flaska:", err);
                        statusEl.innerText = "Status: Błąd wysyłania danych do serwera.";
                    } finally {
                        // ODBLOKOWANIE PRZYCISKU: użytkownik musi kliknąć go ponownie
                        scanBtn.disabled = false;
                    }
                }, { once: true }); // Flaga { once: true } gwarantuje jednorazowe wywołanie eventu

                ndef.addEventListener("readingerror", () => {
                    statusEl.innerText = "Błąd: Nie udało się odczytać taga. Spróbuj ponownie.";
                    scanBtn.disabled = false;
                });

            } catch (error) {
                // Ignorujemy standardowy sygnał przerwania AbortError
                if (error.name !== 'AbortError') {
                    console.error("Błąd uruchamiania NFC:", error);
                    statusEl.innerText = `Błąd: ${error.message}`;
                }
                scanBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
